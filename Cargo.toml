[package]
name = "farocommander"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27.2"
egui = "0.27.2"
chrono = "0.4.38"
walkdir = "2.5.0"
crossbeam-channel = "0.5.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
humansize = "2.1.3"
opendal = { version = "0.59.4", features = ["services-fs", "services-ftp", "services-webdav"] }
tokio = { version = "1.53.2", features = ["full", "rt-multi-thread"] }
egui_extras = "0.27.2"
russh = { git = "https://github.com/Eugeny/russh.git", version = "0.64.1" }
russh-sftp = "3.0.1"
url = "2.5.8"
